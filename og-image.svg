<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07071a"/>
      <stop offset="0.5" stop-color="#0c1a3a"/>
      <stop offset="1" stop-color="#1e1040"/>
    </linearGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <circle cx="120" cy="120" r="250" fill="url(#orbViolet)"/>
  <circle cx="1080" cy="500" r="220" fill="url(#orbCyan)"/>
  <circle cx="950" cy="100" r="120" fill="url(#orbViolet)" opacity="0.6"/>

  <g transform="translate(540, 130)">
    <rect width="120" height="120" rx="24" fill="url(#logoBg)" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2"/>
    <g transform="translate(20, 20) scale(3.33)">
      <circle cx="8" cy="14" r="4" fill="#a78bfa"/>
      <circle cx="8" cy="14" r="1.5" fill="#1e1b4b"/>
      <line x1="11" y1="14" x2="20" y2="14" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="17" y1="14" x2="17" y2="18" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="20" y1="14" x2="20" y2="17" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <text x="600" y="345" text-anchor="middle" fill="#f8fafc" font-family="'Space Grotesk', system-ui, sans-serif" font-size="84" font-weight="700" letter-spacing="-2">
    Gelecek <tspan fill="url(#textGrad)">Bul</tspan>
  </text>

  <text x="600" y="410" text-anchor="middle" fill="#cbd5e1" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="500">
    AI ile Geleceğini Şekillendir
  </text>

  <g transform="translate(465, 460)">
    <rect width="270" height="46" rx="23" fill="rgba(124,58,237,0.18)" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="22" cy="23" r="5" fill="#10b981"/>
    <text x="42" y="30" fill="#e2e8f0" font-family="'Inter', system-ui, sans-serif" font-size="17" font-weight="500">
      Üniversite • Kariyer • Test
    </text>
  </g>

  <text x="600" y="570" text-anchor="middle" fill="#a78bfa" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="600" letter-spacing="0.5">
    gelecekbul.com
  </text>
</svg>
