# Cloudflare Pages + Functions config for gelecekbul2
# Static assets are served from the repo root; serverless API lives in functions/.
name = "gelecekbul2"
compatibility_date = "2024-11-06"
pages_build_output_dir = "."

# Bindings & secrets are configured in the Cloudflare DASHBOARD (Pages project →
# Settings), NOT here. (A placeholder D1 id in wrangler.toml would break a
# dashboard Git deploy.) In the dashboard set:
#   • D1 database binding → variable name "DB" → database gelecekbul2-db
#   • Secrets → GEMINI_API_KEY  and  AUTH_SECRET
# See SETUP-cloudflare.md for the full step-by-step.
